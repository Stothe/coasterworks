[package]
name = "coasterworks-desktop"
version = "0.0.0"
description = "The Coasterworks Mac app: spawns the sidecar and opens the web client against it."
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "coasterworks_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SIGTERM for the sidecar, which `CommandChild::kill` cannot send: it always sends SIGKILL.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
